on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: Static check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.25.0+auto

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - name: Install dupl
        run: "go install github.com/mibk/dupl@latest"
      - name: Vet
        run: "go vet ./..."
      - name: Static check
        continue-on-error: true
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.2.1"
          install-go: false
      - uses: dominikh/staticcheck-action@v1.4.1
        continue-on-error: true
        with:
          version: "2026.2.1"
          install-go: false
          output-file: "static_check_results.txt"
      - name: "Check for duplicated code"
        run: "dupl -t 50 -html > dupl_results.html"
      - name: Upload static check tool results
        uses: actions/upload-artifact@v4
        with:
          name: static_check_results
          path: static_check_results.txt
      - name: Upload dupl results
        uses: actions/upload-artifact@v4
        with:
          name: dupl_results
          path: dupl_results.html

